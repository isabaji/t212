name: Trading212 Bot

on:
  # Every 15 minutes during roughly US market hours (13:00-21:00 UTC), weekdays.
  # Starts alongside the day-trade bot at 13:00 UTC (2pm BST / 9am EDT).
  schedule:
    - cron: '*/15 13-21 * * 1-5'
  # Lets you trigger a run by hand from the Actions tab, with an override on dry-run.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (log intended orders, do not place them)'
        type: boolean
        default: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    # Needed to commit the daily target/loss-limit state file back to the repo.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Run trading bot
        # Config is deliberately stored as Secrets, not Variables, even though
        # none of it is a credential — this repo is public, and only Secrets
        # get GitHub's automatic log-masking. Variables print in plain text in
        # every run's "env:" log block regardless of repo visibility.
        env:
          T212_API_KEY: ${{ secrets.T212_API_KEY }}
          T212_API_SECRET: ${{ secrets.T212_API_SECRET }}
          T212_ENV: ${{ secrets.T212_ENV || 'demo' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || secrets.DRY_RUN || 'true' }}
          I_UNDERSTAND_LIVE_TRADING_RISK: ${{ secrets.I_UNDERSTAND_LIVE_TRADING_RISK || 'no' }}
          WATCHLIST: ${{ secrets.WATCHLIST || 'AAPL,MSFT,GOOGL,AMZN,NVDA,META,TSLA,JPM,V,UNH,HD,XOM,JNJ,PG,DIS,AVGO,CRM,NFLX,NKE,MCD,BAC,MA,PFE,ABBV,CVX,KO,WMT,BA,CAT,NEE' }}
          MAX_POSITION_PCT: ${{ secrets.MAX_POSITION_PCT || '0.10' }}
          MAX_OPEN_POSITIONS: ${{ secrets.MAX_OPEN_POSITIONS || '5' }}
          CASH_BUFFER_PCT: ${{ secrets.CASH_BUFFER_PCT || '0.05' }}
          DAILY_PROFIT_TARGET_PCT: ${{ secrets.DAILY_PROFIT_TARGET_PCT || '0.0075' }}
          DAILY_LOSS_LIMIT_PCT: ${{ secrets.DAILY_LOSS_LIMIT_PCT || '0.01' }}
          LOSING_STREAK_LIMIT: ${{ secrets.LOSING_STREAK_LIMIT || '3' }}
          LOSING_STREAK_COOLDOWN_DAYS: ${{ secrets.LOSING_STREAK_COOLDOWN_DAYS || '5' }}
          RISK_PER_TRADE_PCT: ${{ secrets.RISK_PER_TRADE_PCT || '0.01' }}
          ATR_MULTIPLE: ${{ secrets.ATR_MULTIPLE || '2.0' }}
          ATR_PERIOD: ${{ secrets.ATR_PERIOD || '14' }}
          MAX_SECTOR_EXPOSURE_PCT: ${{ secrets.MAX_SECTOR_EXPOSURE_PCT || '0.25' }}
          MAX_PORTFOLIO_DRAWDOWN_PCT: ${{ secrets.MAX_PORTFOLIO_DRAWDOWN_PCT || '0.15' }}
        run: python main.py run

      - name: Persist bot state (daily target, trade stats, portfolio risk)
        # Percentages/counts only, never a dollar figure — see
        # t212bot/daily_target.py, t212bot/trade_stats.py and
        # t212bot/portfolio_risk.py. Shared with the day-trade workflow, so
        # pushes can race; retry a few times with a rebase in between rather
        # than failing the job over it.
        if: always()
        run: |
          if [ -n "$(git status --porcelain state/ 2>/dev/null)" ]; then
            git config user.name "t212-bot"
            git config user.email "actions@users.noreply.github.com"
            git add state/
            git commit -m "chore: update bot state"
            for i in 1 2 3; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
              echo "Push attempt $i failed, retrying..."
              sleep $((i * 3))
            done
          else
            echo "No change to bot state."
          fi
