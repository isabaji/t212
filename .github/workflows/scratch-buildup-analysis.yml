# TEMPORARY scratch workflow: runs scripts/buildup_analysis.py once (Alpaca
# access isn't available outside Actions). Deleted after the analysis is done,
# same pattern as the earlier regime-analysis scratch tooling.
name: Scratch Build-Up Analysis

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Run build-up analysis
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: python scripts/buildup_analysis.py
