name: Trading212 Backtest

# Manual-only: walk-forward backtest either strategy against the current
# watchlist, optionally testing a stop-loss and/or trend filter (swing only).
# Never touches the live account, so it's safe to run anytime out of
# curiosity. Swing needs no secrets (yfinance, no auth); daytrade needs
# ALPACA_API_KEY/ALPACA_API_SECRET, same free data-only account as the live
# day-trade workflow -- see trading-bot-daytrade.yml.
on:
  workflow_dispatch:
    inputs:
      daytrade:
        description: 'Backtest the day-trade strategy instead of swing'
        type: boolean
        default: false
      fast:
        description: 'Fast SMA window (swing only)'
        type: string
        default: '20'
      slow:
        description: 'Slow SMA window (swing only)'
        type: string
        default: '50'
      windows:
        description: 'Walk-forward windows (blank = default: 4 swing / 2 daytrade)'
        type: string
        default: ''
      stop_atr_multiple:
        description: 'Stop-loss distance in multiples of ATR(14) (swing only, blank = off)'
        type: string
        default: ''
      trend_filter:
        description: 'Require price above its N-day SMA to buy (swing only, blank = off)'
        type: string
        default: ''
      confirm_bars:
        description: '1-min confirmation bars required before entry (daytrade only, blank = config default, 0 = disabled -- run twice to compare)'
        type: string
        default: ''
      stop_loss_pct:
        description: 'Fixed stop-loss as a fraction of entry price, e.g. 0.002 for 0.2%% (daytrade only, blank = off)'
        type: string
        default: ''
      take_profit_pct:
        description: 'Fixed take-profit as a fraction of entry price, e.g. 0.006 for 0.6%% (daytrade only, blank = off)'
        type: string
        default: ''
      rsi_buy_min:
        description: 'Lower bound of RSI buy band (daytrade only, blank = strategy default 50)'
        type: string
        default: ''
      rsi_buy_max:
        description: 'Upper bound of RSI buy band (daytrade only, blank = strategy default 70)'
        type: string
        default: ''
      min_ema_spread_pct:
        description: 'Hard minimum EMA(9)/EMA(21) spread required to enter, as a fraction e.g. 0.001 for 0.1%% (daytrade only, blank = off)'
        type: string
        default: ''
      min_strength:
        description: 'Hard minimum combined setup-quality score (0-1) required to enter (daytrade only, blank = off)'
        type: string
        default: ''
      min_volume_ratio:
        description: 'Hard minimum ratio of breakout-bar volume to its trailing 20-bar average, e.g. 1.2 for 20%% above average (daytrade only, blank = off)'
        type: string
        default: ''
      require_retest:
        description: 'Replace the entry trigger with a pullback-and-hold retest of the opening-range high instead of buying the first breakout bar (daytrade only)'
        type: boolean
        default: false
      retest_tolerance_pct:
        description: 'With require_retest: how far below the opening-range high a pullback may go and still count as a valid retest (blank = strategy default 0.003 = 0.3%%)'
        type: string
        default: ''
      strategy:
        description: 'Day-trade strategy to backtest (daytrade only): orb (default, opening-range breakout), mean_reversion (buy pullbacks to the fast EMA), or ensemble (requires orb + mean_reversion + VWAP-reclaim to all agree)'
        type: choice
        options:
          - orb
          - mean_reversion
          - ensemble
        default: orb

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Run backtest
        # Alpaca is only touched by the --daytrade path; harmless to set
        # unconditionally since the swing backtest never reads them.
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: |
          ARGS="backtest --fast ${{ inputs.fast }} --slow ${{ inputs.slow }}"
          if [ "${{ inputs.daytrade }}" = "true" ]; then ARGS="$ARGS --daytrade"; fi
          if [ -n "${{ inputs.windows }}" ]; then ARGS="$ARGS --windows ${{ inputs.windows }}"; fi
          if [ -n "${{ inputs.stop_atr_multiple }}" ]; then ARGS="$ARGS --stop-atr-multiple ${{ inputs.stop_atr_multiple }}"; fi
          if [ -n "${{ inputs.trend_filter }}" ]; then ARGS="$ARGS --trend-filter ${{ inputs.trend_filter }}"; fi
          if [ -n "${{ inputs.confirm_bars }}" ]; then ARGS="$ARGS --confirm-bars ${{ inputs.confirm_bars }}"; fi
          if [ -n "${{ inputs.stop_loss_pct }}" ]; then ARGS="$ARGS --stop-loss-pct ${{ inputs.stop_loss_pct }}"; fi
          if [ -n "${{ inputs.take_profit_pct }}" ]; then ARGS="$ARGS --take-profit-pct ${{ inputs.take_profit_pct }}"; fi
          if [ -n "${{ inputs.rsi_buy_min }}" ]; then ARGS="$ARGS --rsi-buy-min ${{ inputs.rsi_buy_min }}"; fi
          if [ -n "${{ inputs.rsi_buy_max }}" ]; then ARGS="$ARGS --rsi-buy-max ${{ inputs.rsi_buy_max }}"; fi
          if [ -n "${{ inputs.min_ema_spread_pct }}" ]; then ARGS="$ARGS --min-ema-spread-pct ${{ inputs.min_ema_spread_pct }}"; fi
          if [ -n "${{ inputs.min_strength }}" ]; then ARGS="$ARGS --min-strength ${{ inputs.min_strength }}"; fi
          if [ -n "${{ inputs.min_volume_ratio }}" ]; then ARGS="$ARGS --min-volume-ratio ${{ inputs.min_volume_ratio }}"; fi
          if [ "${{ inputs.require_retest }}" = "true" ]; then ARGS="$ARGS --require-retest"; fi
          if [ -n "${{ inputs.retest_tolerance_pct }}" ]; then ARGS="$ARGS --retest-tolerance-pct ${{ inputs.retest_tolerance_pct }}"; fi
          if [ -n "${{ inputs.strategy }}" ]; then ARGS="$ARGS --strategy ${{ inputs.strategy }}"; fi
          echo "Running: python main.py $ARGS"
          python main.py $ARGS
