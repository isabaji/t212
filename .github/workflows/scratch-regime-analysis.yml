name: Scratch - Regime Analysis

# Temporary, one-off diagnostic workflow (see scripts/regime_analysis.py) --
# not part of the permanent toolset, safe to delete after use. Never touches
# the live account.
on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run regime analysis
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: python scripts/regime_analysis.py
