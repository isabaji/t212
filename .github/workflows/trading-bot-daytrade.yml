name: Trading212 Day-Trading Bot

on:
  # Every 5 minutes across a padded market-hours window (13:00-21:00 UTC covers
  # US market hours across both EST and EDT). The bot itself decides, from the
  # actual data timestamps, whether the market is really open — extra firings
  # outside real market hours are safe no-ops (see STALE_BAR_MINUTES in bot.py).
  schedule:
    # Re-committed 2026-07-28 to re-register the schedule with GitHub after it
    # stopped firing entirely (0 schedule-triggered runs despite valid cron
    # and an active workflow) — see the run history if this needs revisiting.
    - cron: '*/5 13-20 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (log intended orders, do not place them)'
        type: boolean
        default: true
  # External-cron fallback trigger. GitHub's own `schedule` trigger has proven
  # unreliable (stalls for hours with no diagnostic, sometimes doesn't recover
  # after a UI disable/re-enable) — this event type lets a third-party
  # scheduler (e.g. cron-job.org) drive runs via the repo dispatches API
  # instead. Deliberately NOT workflow_dispatch: that event always carries a
  # `dry_run` input (defaulting to true), which would silently force every
  # externally-triggered run into dry-run regardless of the DAYTRADE_DRY_RUN
  # secret. repository_dispatch carries no such input, so DRY_RUN below falls
  # through to the secret exactly like a native `schedule` run would.
  repository_dispatch:
    types: [external-cron-daytrade]

jobs:
  run-daytrade-bot:
    runs-on: ubuntu-latest
    # Needed to commit the daily target/loss-limit state file back to the repo.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Run day-trading bot
        # Config is deliberately stored as Secrets, not Variables, even though
        # none of it is a credential — this repo is public, and only Secrets
        # get GitHub's automatic log-masking. Variables print in plain text in
        # every run's "env:" log block regardless of repo visibility.
        env:
          T212_API_KEY: ${{ secrets.T212_API_KEY }}
          T212_API_SECRET: ${{ secrets.T212_API_SECRET }}
          # Intraday market data (t212bot/data.py) -- a free, data-only Alpaca
          # account, no funding needed. Only this workflow needs it; swing
          # still runs on yfinance daily bars.
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          DAYTRADE_BAR_MINUTES: ${{ secrets.DAYTRADE_BAR_MINUTES || '5' }}
          DAYTRADE_CONFIRM_BARS: ${{ secrets.DAYTRADE_CONFIRM_BARS || '3' }}
          # Entry filter + fixed stop-loss/take-profit -- backtested across 30
          # symbols / 60 days, see t212bot/backtest.py and t212bot/strategy.py.
          DAYTRADE_MIN_EMA_SPREAD_PCT: ${{ secrets.DAYTRADE_MIN_EMA_SPREAD_PCT || '0.001' }}
          DAYTRADE_STOP_LOSS_PCT: ${{ secrets.DAYTRADE_STOP_LOSS_PCT || '0.01' }}
          DAYTRADE_TAKE_PROFIT_PCT: ${{ secrets.DAYTRADE_TAKE_PROFIT_PCT || '0.02' }}
          T212_ENV: ${{ secrets.T212_ENV || 'demo' }}
          # Separate from the swing bot's DRY_RUN so you arm each mode independently.
          DRY_RUN: ${{ github.event.inputs.dry_run || secrets.DAYTRADE_DRY_RUN || 'true' }}
          I_UNDERSTAND_LIVE_TRADING_RISK: ${{ secrets.I_UNDERSTAND_LIVE_TRADING_RISK || 'no' }}
          WATCHLIST: ${{ secrets.DAYTRADE_WATCHLIST || secrets.WATCHLIST || 'AAPL,MSFT,GOOGL,AMZN,NVDA,META,TSLA,JPM,V,UNH,HD,XOM,JNJ,PG,DIS,AVGO,CRM,NFLX,NKE,MCD,BAC,MA,PFE,ABBV,CVX,KO,WMT,BA,CAT,NEE' }}
          MAX_POSITION_PCT: ${{ secrets.MAX_POSITION_PCT || '0.35' }}
          MAX_OPEN_POSITIONS: ${{ secrets.MAX_OPEN_POSITIONS || '10' }}
          CASH_BUFFER_PCT: ${{ secrets.CASH_BUFFER_PCT || '0.05' }}
          DAILY_PROFIT_TARGET_PCT: ${{ secrets.DAILY_PROFIT_TARGET_PCT || '0.0075' }}
          DAILY_LOSS_LIMIT_PCT: ${{ secrets.DAILY_LOSS_LIMIT_PCT || '0.01' }}
          LOSING_STREAK_LIMIT: ${{ secrets.LOSING_STREAK_LIMIT || '3' }}
          LOSING_STREAK_COOLDOWN_DAYS: ${{ secrets.LOSING_STREAK_COOLDOWN_DAYS || '5' }}
          RISK_PER_TRADE_PCT: ${{ secrets.RISK_PER_TRADE_PCT || '0.01' }}
          ATR_MULTIPLE: ${{ secrets.ATR_MULTIPLE || '2.0' }}
          ATR_PERIOD: ${{ secrets.ATR_PERIOD || '14' }}
          MAX_SECTOR_EXPOSURE_PCT: ${{ secrets.MAX_SECTOR_EXPOSURE_PCT || '0.35' }}
          MAX_PORTFOLIO_DRAWDOWN_PCT: ${{ secrets.MAX_PORTFOLIO_DRAWDOWN_PCT || '0.15' }}
        run: python main.py daytrade

      - name: Persist bot state (daily target, trade stats, portfolio risk)
        # Percentages/counts only, never a dollar figure — see
        # t212bot/daily_target.py, t212bot/trade_stats.py and
        # t212bot/portfolio_risk.py. Shared with the swing workflow, so pushes
        # can race; retry a few times with a rebase in between rather than
        # failing the job over it.
        if: always()
        run: |
          if [ -n "$(git status --porcelain state/ 2>/dev/null)" ]; then
            git config user.name "t212-bot"
            git config user.email "actions@users.noreply.github.com"
            git add state/
            git commit -m "chore: update bot state"
            for i in 1 2 3; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
              echo "Push attempt $i failed, retrying..."
              sleep $((i * 3))
            done
          else
            echo "No change to bot state."
          fi
