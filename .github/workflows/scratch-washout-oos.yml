# TEMPORARY scratch workflow: backward out-of-sample check of the washout
# strategy on the ~month BEFORE the 60-day window it was mined from
# (backtest.yml is at the 25-input cap, so the new --days/--exclude-recent-days
# flags are driven from here instead). Runs both variants in one job.
# Deleted after the check is done, same pattern as earlier scratch tooling.
name: Scratch Washout Out-of-Sample

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Washout, prior period, no stop
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: python main.py backtest --daytrade --strategy washout --windows 6 --days 90 --exclude-recent-days 60

      - name: Washout, prior period, 2% stop
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: python main.py backtest --daytrade --strategy washout --windows 6 --days 90 --exclude-recent-days 60 --stop-loss-pct 0.02
