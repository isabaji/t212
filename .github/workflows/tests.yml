name: Tests

# Offline unit/integration tests (tests/): every cycle runs end to end
# against faked broker, feeds, regime and calendar. No credentials, no
# network -- a push that breaks a cycle fails here, not at market open.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements-dev.txt

      - run: python -m pytest
